<!DOCTYPE html>
<html>
<head>
    <title>CSS Web Page Design</title>

    <style>
        body {
            margin: 50px;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGRIP3H1yj6IfAB6Ix2W76taHVnajWGuK5K0As7k4wJA&s=10");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial;
        }

        .container {
            width: 70%;
            margin: 50px;
            padding: 30px;
            border: 4px solid black;
            border-radius: 15px;
            background-color: yellowgreen;
            text-align: center;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4wvFk3QBpE8uZ2UoG0yJR1jDwE0sghDxAPA4wQi-7bg&s=10");
            background-size: 100% 210% ;
            background-repeat: no-repeat;
            background-position: center;
            
        }

        h1 {
            color: black;
            padding: 10px;
        }

        p {
            border: 2px solid black;
            padding: 10px;
            margin: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> My Web Page </h1>
        <p><b>
            This webpage demonstrates borders, padding
            and background images using CSS.</b>
        </p>
    </div>
</body>
</html>
