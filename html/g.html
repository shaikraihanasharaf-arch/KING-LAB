<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>

<body>

    <h2><u><b>REGISTRATION FORM</b></h2>

    <form>

        <label>Text:</label>
        <input type="text"><br><br>

        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter password" required><br><br>

        <label>File:</label>
        <input type="file"><br><br>

        <label>Date:</label>
        <input type="date"><br><br>

        <label>Image:</label>
        <input type="image" src="image.jpg" alt="Submit" width="100"><br><br>

        <label>Submit:</label>
        <input type="submit" value="Submit"><br><br>

        <label>Number:</label>
        <input type="number"><br><br>

        <label>Email:</label>
        <input type="email"><br><br>

        <label>Date-Time Local:</label>
        <input type="datetime-local"><br><br>

        <label>Month:</label>
        <input type="month"><br><br>

        <label>Week:</label>
        <input type="week"><br><br>

        <label>Radio:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

        <label>Checkbox:</label>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS<br><br>

        <label>Reset:</label>
        <input type="reset" value="Reset"><br><br>

        <label>Button:</label>
        <input type="button" value="Click Me"><br><br>

        <label>Range:</label>
        <input type="range"><br><br>

        <label>Search:</label>
        <input type="search" placeholder="Search here"><br><br>

        <label>Color:</label>
        <input type="color"><br><br>

    </form>

</body>
</html>
