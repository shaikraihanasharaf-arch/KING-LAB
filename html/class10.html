<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <style>
        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid rgb(23, 23, 120);
            margin: 30px;
            background-color: rgb(49, 163, 201);
        }
        .box1{
            width: 600px;
            padding: 40px;
            border: 10px solid rgb(0, 0, 0);
            margin: 60px;
            background-color: rgb(155, 33, 11);
        }
    </style>
</head> 
<body>
    <div class="box">
        My Name is asharaf.
    </div>
    <div class="box1">
        This is the Basic CSS BOX MODEL.
    </div>
</body>
</html>
