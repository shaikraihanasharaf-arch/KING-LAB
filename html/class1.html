<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>

    <style>
        body {
            background-color: #dff7f7;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            margin: 30px auto;
            padding: 15px;
            background-color: white;
            border: 2px solid #999;
            border-radius: 30px;
        }

        h2 {
            text-align: center;
            color: #8b3f4d;
        }

        .heading {
            background-color: #d49a00;
            color: white;
            padding: 8px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th {
            background-color: #b9d58b;
            text-align: left;
        }

        th, td {
            border: 1px solid #9cc5c5;
            padding: 7px;
            font-size: 13px;
        }

        td:last-child {
            text-align: right;
            font-weight: bold;
            color: #a33b4b;
        }
    </style>
</head>

<body>

<div class="container">

    <h2> Siri's Restaurant </h2>

    <div class="heading">Starters</div>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Vegetable Soup</td>
            <td>₹80</td>
        </tr>
        <tr>
            <td>Paneer Tikka</td>
            <td>₹150</td>
        </tr>
        <tr>
            <td>French Fries</td>
            <td>₹100</td>
        </tr>
    </table>


    <div class="heading">Main Course</div>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Veg Biryani</td>
            <td>₹180</td>
        </tr>
        <tr>
            <td>Chicken Biryani</td>
            <td>₹250</td>
        </tr>
        <tr>
            <td>Paneer Butter Masala</td>
            <td>₹200</td>
        </tr>
        <tr>
            <td>Butter Naan</td>
            <td>₹50</td>
        </tr>
    </table>


    <div class="heading">Drinks</div>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Fresh Lime Soda</td>
            <td>₹60</td>
        </tr>
        <tr>
            <td>Cold Coffee</td>
            <td>₹100</td>
        </tr>
        <tr>
            <td>Fresh Juice</td>
            <td>₹90</td>
        </tr>
    </table>

</div>

</body>
</html>
